# Use the least expensive capable model for routine Canvas automation
model = "gpt-5.6-luna"
model_reasoning_effort = "low"

# Settings from canvas agent guard --host codex
# TODO: update this. See `approval_policy` below.
sandbox_mode    = "read-only"

# See <https://github.com/openai/codex/issues/39973>
#approval_policy = "untrusted"
approval_policy = "on-request"

# Allow network access to Canvas
[sandbox_workspace_write]
network_access = true



